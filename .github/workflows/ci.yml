name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  fast:
    name: Fast unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest opencv-python-headless pyyaml pandas openpyxl

      - name: Run fast tests
        run: |
          python -m pytest tests/test_id_metrics.py tests/test_synthetic_safeguards.py tests/test_address_clean.py -q

  slow:
    name: Slow OCR/YOLO tests (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest opencv-python-headless pyyaml pandas openpyxl ultralytics easyocr pytesseract

      - name: Run slow tests
        run: |
          if [ ! -f runs/train_id_detectr_hyper/weights/best.pt ]; then
            echo "Skipping slow tests: weights not present (train locally or upload weights)."
            exit 0
          fi
          python -m pytest tests/ -m slow -q
